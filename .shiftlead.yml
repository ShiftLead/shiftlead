# shiftlead's own answer to how `main` becomes what is running (design §5 `promote:`, §6 *Promote*;
# TD-132 slice 4). The home runs both in this checkout. `run` is CLAUDE.md's promote pair: it
# rebuilds the live venv from this checkout and replaces the client and the host agent together,
# which restarts the agent that started it (sessions live in tmux and survive it). `check` prints
# the commit the live install was built from, or fails saying why. Whether the home promotes on
# its own is `auto`, the Settings page's switch (`settings.yml`), never this file.
promote:
  run: V="$HOME/.local/share/shiftlead-venv/bin"; "$V/pip" install --upgrade "$(pwd -P)[ui]" && "$V/ao" service install
  check: >-
    "$HOME/.local/share/shiftlead-venv/bin/python" -c 'import sys; from sessionorc import build;
    c = build.info().get("commit"); print(c) if c else sys.exit("build unknown: the live install carries no build record")'
  # once `check` reads the commit live, the home runs this in the tree and the promote is done only when it
  # passes; a failure puts back what was live before (§6 *The smoke*, TD-812). It loads every page but a
  # Focus and reads `ao` (never `ao inbox`); its browser half wants `scripts/smoke.py --setup`, run once.
  smoke: '"$HOME/.local/share/shiftlead-venv/bin/python" scripts/smoke.py'

# The paths a PR must have read before it merges (design §4.9c *What is the repo's: `held:`*; TD-310):
# the host agent's package, the briefs, and the ledger's host-log sources (§4.4 *The source*, TD-1388).
# Under a flow every review stage holds them, whoever wrote the PR; a team with no flow reads a role's own
# `review:`, and this file writes none.
held: ["src/sessionorc/**", "docs/briefs/**", "docs/ledger/log-sources.toml"]

# The commands the built-in briefs' {test} and {lint} fill with (design §5 *The seams* `commands:`; TD-588):
# the briefs name no repo's layout, so this repo's own lives here.
commands: {test: pdm run test, lint: pdm run lint}

# How a new worktree is set up (design §5 *The seams* `worktree_setup:`, TD-589): unset, so the home runs
# the pinned agent-cadence tree's hydrate_worktree.sh (`gitinfo.hydrate_command`, TD-1044).

# How long a new ledger entry waits, holdable, before a lane may take it (design §4.4 *A new entry
# settles before it is pickable*, §5 `settle:`; TD-707, TD-710): a `design-first` entry ten minutes,
# so Paul can change or Hold one a session filed; a designer's `build` entries go at once. Wins over
# `settings.yml`'s `settle:` key by key.
settle: {design-first: 10m}

# The ao-grind team, defined in the repo it works (design §4.9 *The org is an aggregate*; TD-229
# slice 2), on flows since TD-310 (design §4.9c): `td` — design → build → review — is its default,
# `build-review` the switch when no design is wanted (`ao team flow ao-grind build-review`). The flow
# fills what the definition used to write — each member's lane, `entries.feature`, the roles' `review:`
# — so none of those is written here (`ao org check` names any that comes back). While
# `~/.shiftlead/org.yml` still defines `ao-grind` it wins the name and this one reads *shadowed by
# org.yml*; removing the team from the org file is the switch. The profiles stay the org file's
# `roles:` overlay (the install's word), and no `host:` — where a repo's team lands is the org's `place:`.
teams:
  ao-grind:
    flows: [td, build-review]
    # on call (the `manager` role's default, design §6 rule 3): a Start writes it closed, and the tick fills it
    # only for a reading no policy makes — a question to it, a permission, a stalled or idle-with-work member
    manager: {role: manager, name: manager-ao-1, brief: docs/briefs/manager-ao-1.md}
    techlead: {name: techlead-ao-1, context: docs/briefs/techlead-context.md}
    # seats with a trigger (design §4.9b, TD-098): auditors that file what the last PRs left in the
    # docs and the tests, and never fix it; each fills after ten merged PRs, so an idle week costs nothing.
    # A seat line lands, or moves to another profile, only on a profile the seat smoke has passed on, its passing
    # line quoted in the PR (`pdm run conformance <adapter> --profile <p> --smoke`, design §4.3, TD-1648).
    # A seat line holding the fact-checker role alone lands only on a profile with a passing `pdm run judge` row
    # in docs/judgment/fact-checker.md, quoted in the PR (design §4.9b *A model's fitness, before the role*, TD-1649).
    seats:
      - {name: docs-audit-ao-1, role: auditor, brief: docs/briefs/docs-audit.md, trigger: {prs: 10}}
      - {name: test-audit-ao-1, role: auditor, brief: docs/briefs/test-audit.md, trigger: {prs: 10}}
      # the fact-check trial (design §4.9b *The fact-check*, TD-1213): a Gemini seat on a free account, asked
      # beside each member's own fact-check of a doc-only PR, never instead of it; filled by an ask, closed idle
      - {name: fact-check-ao-1, role: fact-checker, profile: gemini-reader, trigger: asks}
      # a second model on trial (design §4.9b *A second model on trial*, TD-1638): a Grok Build seat on the
      # person's SuperGrok account, asked beside fact-check-ao-1 on every doc-only PR, its trial lines counted apart
      - {name: fact-check-ao-2, role: fact-checker, profile: grok-reader, trigger: asks}
    members:
      - {role: grinder, name: grinder-ao-1, brief: docs/briefs/grinder-ao-1.md}
      # the second grinder: both share the build stage's one lane and pick the top-ranked entry nobody holds (TD-749)
      # TD-641's trial (Paul, 2026-11-03): grinder-ao-2 alone on `grind-ask` (profiles.yml), whose unattended launch keeps its
      # permission prompts, so settings.yml's `permissions: grinder:` rules answer them; grinder-ao-1 stays on `grind`
      - {role: grinder, name: grinder-ao-2, brief: docs/briefs/grinder-ao-2.md, profile: grind-ask}
      # the design stage's member; what the person sees of a design is its own call (design §4.8)
      - {role: designer, name: designer-ao-1, unattended: true}

# The repo's part of each role's brief (design §4.8 `{repo}`): the grinders' and the manager's are
# named on the team above; the designer's is the preset's supplement, its mechanics the package's
# `designer.md` (design §4.9c *The designer gets a template*).
roles:
  designer:
    brief: docs/briefs/designer-ao-1.md
    # a 150k bound, so each design starts in a fresh run: Paul's answer to TD-1721 (2026-11-13; design §4.9c
    # *What the designer carries from one design to the next*), at the designer's next start
    context: {bound: 150k}
  # a 200k bound on the grinders, measured: two trial weeks (2026-10-09 to 10-23) cost 5-7% less per
  # merged PR than the week before (TD-460; docs/decisions/2026-10-08-prompt-cache.md, Consequences)
  grinder:
    context: {bound: 200k}
