name: Feedback report
description: A feedback report that /shiftlead-feedback wrote in report mode, pasted as written.
title: "feedback report: "
body:
  - type: markdown
    attributes:
      value: |
        ### ⚠️ Public at once: this issue is mailed to the repo's watchers as soon as you submit it.

        **What it holds:** the findings you approved, a few counts, and your install's shiftlead commit. No transcript text beyond the sentences you approved.

        **Before you submit**
        - **Read it for names and private work.** The scrub misses other spellings, branches, people's names and private work described in plain words. Only your read of the whole report catches what it cannot.
        - **Paste it exactly as the run wrote it**, everything after its first line (the title). Never change it by hand: answer *edit* in the run instead.
        - **An edit after submitting** keeps the earlier text in the issue's edit history, which anyone who sees the issue can open.

  - type: textarea
    id: report
    attributes:
      label: Report
      description: The report's Markdown after its first line, as the run wrote it.
    validations:
      required: true
