{# A **project heading** (design §4.9 *The Org page*, TD-725): its `title`, else its name, over its repos'
   lines in its list's order. Drawn only for a project of two repos or more — one of a single repo is
   that repo's line. Headings do not fold. #}
<div class="phead" data-key="{{ g.key }}" data-project="{{ g.project }}"><span class="h1">{{ g.label }}</span></div>
