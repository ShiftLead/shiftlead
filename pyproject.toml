[project]
name = "shiftlead"
version = "0.0.1"
description = "Orchestrate interactive AI coding-agent sessions and shells running in tmux across hosts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "jinja2>=3.1",
    "ptyprocess>=0.7",
    "python-multipart>=0.0.9",
    "pywebpush>=2.0",
]

[project.scripts]
shiftlead = "shiftlead.cli:main"
ao = "shiftlead.cli:main"
shiftlead-agent = "sessionorc.agent:main"
shiftlead-hook = "shiftlead.hook_entry:main"
shiftlead-ui = "shiftlead.ui.app:main"
shiftlead-watch = "shiftlead.watch:main"
agent-cadence = "sessionorc.agent_cadence_entry:main"

[project.entry-points."shiftlead.adapters"]
claude-code = "shiftlead.adapters.claude_code:ClaudeCodeAdapter"
gemini = "shiftlead.adapters.gemini:GeminiAdapter"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.build]
package-dir = "src"
includes = ["src/sessionorc", "src/shiftlead"]
source-includes = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    # A hung test is worth less than a failing one: it dies at the job level with no output at
    # all — 26 minutes on PR #192, unattributed to this day, and 14 minutes on 2026-09-20. With
    # this, it fails in the file that hung, with every thread's stack (TD-063).
    "pytest-timeout>=2.3",
    # the suite across the machine's cores: one core took 12 minutes a precheck (TD-1068)
    "pytest-xdist>=3.6",
    # one exact ruff, so every checkout formats alike and `pdm run fmt` on main changes nothing; bumped by PR (TD-1487)
    "ruff==0.16.6",
    "httpx>=0.27",
]

[tool.pdm.scripts]
# eight workers (TD-1068): ~100 s against 12 min on one core, and room beside other prechecks on 16 cores
test = "pytest -q -n 8"
test-fast = "pytest -q -m unit"
# the tests that read this checkout's docs/ (TD-1483): what docs/cadence.toml's [precheck-paths] runs for a
# docs-only PR. Found by an audit hook over the whole suite (every open, listdir and stat under docs/, 2026-11-07),
# plus test_ledger*, test_design_doc* and test_help*. A test that reads docs/ joins this list.
test-docs = { cmd = ["pytest", "-q", "-n", "8",
    "tests/test_board.py",
    "tests/test_briefs_layout.py",
    "tests/test_cli.py",
    "tests/test_cli_teams.py",
    "tests/test_decision_coverage_gate.py",
    "tests/test_design_doc.py",
    "tests/test_gate_sweep.py",
    "tests/test_help.py",
    "tests/test_host_log_sources.py",
    "tests/test_ledger.py",
    "tests/test_ledger_derived.py",
    "tests/test_ledger_layout.py",
    "tests/test_ledger_writes.py",
    "tests/test_ledgerboard_fixtures.py",
    "tests/test_look_home.py",
    "tests/test_org.py",
    "tests/test_primer.py",
    "tests/test_rank_order.py",
    "tests/test_repo_adopt.py",
    "tests/test_repo_facts.py",
    "tests/test_screen.py",
    "tests/test_td_next.py",
    "tests/test_ui.py",
    "tests/test_ui_board.py",
    "tests/test_ui_board_add.py",
    "tests/test_worktree_reap.py",
] }
# the format check too, so no unformatted file lands for the next `fmt` to sweep into another PR (TD-1487)
lint = { composite = ["ruff check src tests", "ruff format --check src tests"] }
fmt = "ruff format src tests"
# the adapter conformance suite's live walk, by hand (design §4.3, TD-784): `pdm run conformance <adapter> --profile <p>`
conformance = "python scripts/conformance.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# **A hang must fail, and say where** (TD-063, TD-078). Twice a job has died with no output at
# all: 26 minutes on PR #192, unattributed to this day, and 14 minutes on 2026-09-20 whose last
# line was the test *before* the one that hung. The bound is **per test item** — setup, call and
# teardown — not per file, and 120 s is more than a tenfold margin over the slowest test here
# (about 10 s, the one that restarts an agent under a blocked wait) while staying far under a CI
# job's patience, so a runner several times slower than this machine still cannot go red on it.
#
# `thread` rather than `signal`, deliberately, and it is not free: on expiry it dumps **every
# thread's stack** and then `os._exit`s, so the run ends there — no fixture teardown, no summary,
# the remaining tests unrun. That is the right trade for this suite because the hangs it is aimed
# at are in *threads* — `asyncio.to_thread`, a tmux read, a client waiting on a reply — and
# `signal` can only raise in the main thread: it would fail the test and leave the stuck thread
# running, which is a worse run than one that stops. A stopped run with a stack beats a cancelled
# job with none, and the stacks are the whole point (review of PR #314).
timeout = 120
timeout_method = "thread"
markers = [
    "unit: no tmux, sockets, or subprocesses; sub-second",
    "integration: spawns tmux, a host agent, git, or the hook script",
]
filterwarnings = [
    # TD-007 (archived): starlette's TestClient keeps a portal thread alive, so ptyprocess's
    # forkpty() in the /term tests runs in a multi-threaded process. The child only execs, the
    # exposure is accepted; see tests/README.md "Real-environment dependencies".
    "ignore:This process .* is multi-threaded, use of forkpty\\(\\) may lead to deadlocks:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# the vendored ledgerboard and its fixtures are read, never formatted: its release header hashes its
# body and a test holds it byte-equal to the pinned agent-cadence tree's scripts/ledgerboard/ (ADR
# 2026-10-12, TD-585); agent-cadence's launcher is vendored frozen, its hash held by a test (§5 *How the
# readers find agent-cadence*, TD-1014)
extend-exclude = ["scripts", "docs", "src/sessionorc/ledgerboard", "src/sessionorc/agent_cadence.py", "tests/ledgerboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
