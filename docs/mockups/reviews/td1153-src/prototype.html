<title>Team Page Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a settings rail on the left; the team as a route map (each way in is a line, each stage a stop, entries wait at stops), then the login ladder, then the timetable. */
:root {
  --page:#E7EBEC; --sheet:#FAFBFB; --ink:#1F272C; --soft:#5D6970; --faint:#9AA5AA; --rule:#C6CFD3; --rule2:#DDE3E5;
  --design:#5B5BD6; --build:#2D7FB8; --review:#C27A1A; --ok:#2E8A57; --warn:#9A6212; --bad:#B4432F; --badbg:#FBEDEA; --money:#9A6212;
  --head:"IBM Plex Sans", system-ui, sans-serif; --body:"IBM Plex Sans", system-ui, sans-serif; --mono:"IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page:#161B1E; --sheet:#1F262A; --ink:#E4EAEC; --soft:#9AA8AF; --faint:#6C7A81; --rule:#3B474D; --rule2:#2E383D;
  --design:#8E8EF0; --build:#5AA9DD; --review:#DDA04A; --ok:#5CBF8A; --warn:#E0A548; --bad:#F08A76; --badbg:#3A2420; --money:#E0A548; color-scheme:dark } }
:root[data-theme="dark"] {
  --page:#161B1E; --sheet:#1F262A; --ink:#E4EAEC; --soft:#9AA8AF; --faint:#6C7A81; --rule:#3B474D; --rule2:#2E383D;
  --design:#8E8EF0; --build:#5AA9DD; --review:#DDA04A; --ok:#5CBF8A; --warn:#E0A548; --bad:#F08A76; --badbg:#3A2420; --money:#E0A548; color-scheme:dark }
* { box-sizing:border-box; }
body { background:var(--page); color:var(--ink); font:15px/1.5 var(--body); }
.wrap { max-width:1280px; margin:0 auto; padding-block:20px 72px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); display:grid; grid-template-columns:170px minmax(0,1fr); gap:36px; }
@media (max-width:860px) { .wrap { grid-template-columns:minmax(0,1fr); gap:14px; } }
button, select, input { font:inherit; color:var(--ink); }
button { cursor:pointer; background:none; border:1px solid var(--ink); border-radius:3px; padding:3px 12px; font:500 13px var(--body); }
button.pri { background:var(--ink); color:var(--page); }
button.quiet { border-color:var(--rule); color:var(--soft); font-weight:500; }
button[disabled] { opacity:.45; cursor:default; }
button.lnk { border:none; padding:0; color:var(--build); font-weight:500; text-decoration:underline; border-radius:0; }
:focus-visible { outline:2px solid var(--build); outline-offset:2px; }
select, input[type=text] { background:var(--sheet); border:1.5px solid var(--rule); border-radius:6px; padding:3px 8px; font-size:15px; }
.mono { font-family:var(--mono); font-size:.9em; }

.rail { font-size:15px; }
.rail .gear { font:700 13px var(--head); color:var(--soft); margin:6px 0 10px; }
.rail a { display:block; padding:5px 10px; border-radius:6px; color:var(--soft); cursor:pointer; }
.rail a.on { background:var(--ink); color:var(--page); font-weight:600; }
.rail p { font-size:13.5px; color:var(--soft); margin:16px 0 0; line-height:1.4; }
@media (max-width:860px) { .rail { display:flex; flex-wrap:wrap; gap:4px; align-items:center; } .rail .gear { margin:0 8px 0 0; } .rail p { display:none; } }
.note { font-size:13.5px; color:var(--soft); background:var(--sheet); border:1px dashed var(--rule); border-radius:6px; padding:6px 10px; margin-bottom:14px; }

.teams { display:flex; gap:6px; flex-wrap:wrap; align-items:center; border-bottom:2px solid var(--ink); }
.teams a { padding:6px 14px 5px; font:600 15px var(--mono); color:var(--soft); cursor:pointer; border-radius:8px 8px 0 0; }
.teams a.on { background:var(--ink); color:var(--page); }
.teams a i { font-style:normal; color:var(--bad); }
.teams button { margin-left:auto; margin-bottom:4px; }
.head { display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap; margin:22px 0 4px; }
.head h1 { margin:0; font:600 30px/1 var(--mono); }
.head .where { color:var(--soft); font-size:15px; padding-bottom:4px; }
.head .act { margin-left:auto; display:flex; gap:10px; align-items:center; padding-bottom:2px; }
.live { font-weight:600; color:var(--ok); } .live.off { color:var(--faint); }
h2 { font:600 18px var(--head); margin:30px 0 2px; }
p.lead { margin:0 0 12px; color:var(--soft); max-width:70ch; font-size:15px; }
.pick { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:10px 0 14px; }
.pick select { font:600 15px var(--mono); }
.pick span { color:var(--soft); font-size:15px; }
.bad { color:var(--bad); font-size:15px; }

.map { background:var(--sheet); border:1px solid var(--rule2); border-radius:6px; padding:6px 18px 14px; }
.ln { padding:14px 0 6px; border-bottom:1px solid var(--rule2); }
.ln:last-of-type { border-bottom:none; }
.ln .from { font-size:14px; color:var(--soft); margin-bottom:10px; }
.ln .from b { color:var(--c); font-weight:600; }
.stops { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); }
.stop { position:relative; padding:22px 14px 4px 0; min-width:0; }
.stop::before { content:""; position:absolute; left:0; right:0; top:6px; height:5px; background:var(--c); }
.stop:first-child::before { border-radius:3px 0 0 3px; }
.stop.end::before { right:auto; width:14px; border-radius:0 3px 3px 0; }
.stop::after { content:""; position:absolute; left:0; top:0; width:17px; height:17px; border-radius:50%; background:var(--sheet); border:4px solid var(--k); }
.stop.end::after { left:8px; background:var(--ink); border-color:var(--ink); width:13px; height:13px; top:2px; }
.stop .nm { font:700 16px var(--head); }
.stop .kind { font-size:13px; color:var(--k); font-weight:600; }
.stop .on { font-size:13.5px; color:var(--soft); margin-top:2px; overflow-wrap:anywhere; }
.stop .on b { font:600 12.5px var(--mono); color:var(--ink); }
.stop .on.no { color:var(--bad); }
.stop.end .nm { color:var(--soft); font-weight:600; padding-left:30px; }
.step { display:inline-flex; align-items:center; gap:2px; margin-top:6px; font-size:13.5px; color:var(--soft); }
.step button { width:22px; height:22px; padding:0; border-radius:50%; border-color:var(--rule); font:600 14px/1 var(--body); color:var(--soft); }
.step b { font:600 14px var(--mono); color:var(--ink); min-width:16px; text-align:center; }
.riders { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; min-height:24px; }
.rider { font:600 12.5px var(--mono); background:var(--k); color:var(--sheet); border-radius:999px; padding:1px 9px; white-space:nowrap; }
.rider small { font:400 12px var(--body); opacity:.85; margin-left:4px; }
.rider.you { background:none; color:var(--warn); border:1.5px dashed var(--warn); }
@media (max-width:760px) { .stops { grid-auto-flow:row; } .stop { padding:0 0 16px 30px; } .stop::before { left:6px; right:auto; top:0; bottom:0; width:5px; height:auto; } .stop.end::before { width:5px; height:10px; bottom:auto; } .stop::after { left:0; } .stop.end::after { left:2px; top:6px; } .stop.end .nm { padding-left:0; } }
.aside { display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:4px 28px; padding-top:12px; font-size:14px; }
.aside h3 { margin:0 0 2px; font:700 14px var(--head); grid-column:1 / -1; }
.aside div { display:flex; gap:8px; color:var(--soft); min-width:0; }
.aside div b { color:var(--ink); font-weight:500; white-space:nowrap; }
.aside div .mono { margin-left:auto; color:var(--ink); font-weight:600; white-space:nowrap; }
.total { margin-top:12px; font-size:15px; color:var(--soft); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

.sw { border:2.5px solid var(--ink); border-radius:6px; background:var(--sheet); padding:14px 18px; margin-bottom:14px; }
.sw h3 { margin:0 0 6px; font:700 18px var(--head); }
.sw table { border-collapse:collapse; font-size:15px; margin:4px 0 8px; }
.sw td { padding:2px 16px 2px 0; vertical-align:baseline; }
.sw td:first-child { font:600 13.5px var(--mono); }
.sw .stay { color:var(--ok); } .sw .go { color:var(--warn); }
.sw p { margin:4px 0 10px; color:var(--soft); font-size:15px; max-width:74ch; }
.sw .btns { display:flex; gap:8px; flex-wrap:wrap; }

.ladder { list-style:none; margin:0; padding:0; }
.ladder li { display:grid; grid-template-columns:44px minmax(0,1.2fr) minmax(0,1.3fr) 76px; gap:14px; align-items:center; background:var(--sheet); border:1px solid var(--rule2); border-radius:6px; padding:10px 14px; position:relative; margin-bottom:22px; }
.ladder li:not(:last-child)::after { content:"if not usable, then"; position:absolute; left:58px; bottom:-21px; font-size:12.5px; color:var(--faint); }
.ladder li:not(:last-child)::before { content:""; position:absolute; left:35px; bottom:-23px; height:23px; width:2px; background:var(--rule); }
.ladder .n { font:600 24px/1 var(--mono); color:var(--ink); text-align:center; }
.ladder li.skip { border-style:dashed; } .ladder li.skip .n { color:var(--faint); }
.ladder .who b { font:600 15.5px var(--mono); }
.ladder .who small, .ladder .use small { display:block; color:var(--soft); font-size:13.5px; }
.ladder .tagm { font:600 12px var(--body); color:var(--money); border:1.5px solid var(--money); border-radius:999px; padding:0 7px; margin-left:6px; white-space:nowrap; }
.gauge { height:9px; border-radius:5px; background:var(--rule2); position:relative; overflow:hidden; margin:3px 0; }
.gauge i { position:absolute; left:0; top:0; bottom:0; background:var(--ink); }
.gauge u { position:absolute; right:0; top:0; bottom:0; background:repeating-linear-gradient(135deg, var(--faint) 0 2px, transparent 2px 5px); }
.use .s-ok { color:var(--ok); font-weight:600; } .use .s-wait { color:var(--warn); font-weight:600; } .use .s-bad { color:var(--bad); font-weight:600; }
.ladder .mv { display:flex; gap:2px; justify-content:flex-end; }
.ladder .mv button { width:24px; height:24px; padding:0; border-radius:50%; border-color:var(--rule); color:var(--soft); font-size:11px; }
@media (max-width:700px) { .ladder li { grid-template-columns:34px minmax(0,1fr) 76px; } .ladder .use { grid-column:2 / 4; } .ladder .mv { grid-row:1; grid-column:3; } }
.addl { display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:15px; color:var(--soft); }
.addl select { max-width:100%; min-width:0; }

.tt { background:var(--sheet); border:1px solid var(--rule2); border-radius:6px; }
.tt > div { display:grid; grid-template-columns:180px minmax(0,340px) minmax(0,1fr); gap:6px 16px; align-items:center; padding:10px 18px; border-bottom:1px solid var(--rule2); }
.tt > div:last-child { border-bottom:none; }
.tt > div > span:first-child { font-weight:600; }
.tt > div > span:last-child { color:var(--soft); font-size:14px; }
.tt .inl { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.tt .inl input[type=text] { width:70px; }
@media (max-width:760px) { .tt > div { grid-template-columns:minmax(0,1fr); } }
.toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom, 0px)); background:var(--ink); color:var(--page); padding:7px 18px; border-radius:999px; font-size:14px; }
</style>

<div class="wrap">
  <nav class="rail"><div class="gear">⚙ behind the gear</div><a data-nav="Settings">Settings</a><a data-nav="Tools">Tools</a><a data-nav="Flows">Flows</a><a data-nav="Briefs">Briefs</a><a data-nav="teams" id="nav-teams">Teams</a><a data-nav="builtins" id="nav-builtins">Built-in seats</a>
    <p id="railnote"></p></nav>
  <main><div class="note">A working prototype of the team page and the Built-in seats page (TD-1153), as they are after the switch-over. Everything stays in this browser. Teams, logins, entries and numbers are examples.</div><div id="main"></div></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const KC = { design: "--design", build: "--build", review: "--review" };
const S = (name, does, model, x) => Object.assign({ name, does, model, key: name.toLowerCase().replace(/ /g, "-") }, x || {});
const SEATS = [["tech-lead", "Tech lead", "answers sessions' questions, tags new entries", "each team"], ["manager", "Manager", "watches a team's sessions and nudges stuck ones", "each team"], ["board-answers", "Board answers", "carries out what you decided on the board", "the repo"], ["unheld-pull-requests", "Pull requests nobody holds", "cures a red or orphaned pull request", "the repo"], ["sweeper", "Sweeper", "the periodic sweep for stranded work", "the repo"]];
const MODELS = ["haiku", "sonnet", "opus", "fable", "flash", "flash-lite", "grok-4"];
const FLOWS = {
  td: { about: "design with two reads and a fact-check; build, review, a protected read", stages: [S("Design", "design", "fable"), S("Sonnet read", "review", "sonnet"), S("Opus read", "review", "opus"), S("Fact-check", "review", "haiku"), S("Build", "build", "opus"), S("Review", "review", "sonnet"), S("Protected read", "review", "fable", { only: true })],
        lines: [["Entries that need a design first", ["design", "sonnet-read", "opus-read", "fact-check"]], ["Entries ready to build", ["build", "review", "protected-read"]]],
        audits: [["Docs audit", "sonnet", "every 10 merged pull requests · 4 to go"], ["Test audit", "sonnet", "every 6 hours · in 2h 10m"]] },
  "build-review": { about: "build, then one review", stages: [S("Build", "build", "opus"), S("Review", "review", "sonnet")], lines: [["Every entry", ["build", "review"]]], audits: [] },
  build: { about: "build and merge; the builder runs the repo's own review", stages: [S("Build", "build", "opus")], lines: [["Every entry", ["build"]]], audits: [] },
  "second-opinion": { about: "yours: a second review on another maker's model", stages: [S("Build", "build", "opus"), S("Review", "review", "sonnet"), S("Outside read", "review", "grok-4")], lines: [["Every entry", ["build", "review", "outside-read"]]], audits: [["Code audit", "sonnet", "every day · tomorrow 07:00"]] },
};
const LOGINS = {
  "claude-paul": { tool: "Claude Code", acct: "Max · paul", models: ["haiku", "sonnet", "opus", "fable"], state: "ok", used: 41, keep: 20, note: "week 41% used · keeps 20% back" },
  "claude-heather": { tool: "Claude Code", acct: "Max · heather", models: ["haiku", "sonnet", "opus", "fable"], state: "wait", used: 80, keep: 20, note: "at its reserve until Thu 07:00" },
  "claude-api": { tool: "Claude Code", acct: "API key", models: ["haiku", "sonnet", "opus", "fable"], state: "ok", metered: true, used: 38, keep: 0, note: "$38 of $100 this month" },
  "gemini-reader": { tool: "Gemini CLI", acct: "free · paul", models: ["flash", "flash-lite"], state: "ok", used: 12, keep: 10, note: "day 12% used" },
  "grok-reader": { tool: "Grok Build", acct: "SuperGrok · paul", models: ["grok-4"], state: "ok", used: 3, keep: 10, note: "week 3% used" },
};
const DEF = { page: "teams", set: "default", repoSet: { shiftlead: "default", samscrape: "default" },
  sets: { default: { label: "", models: { "tech-lead": "opus", manager: "haiku", "board-answers": "sonnet", "unheld-pull-requests": "sonnet", sweeper: "haiku" }, logins: ["claude-paul", "claude-api"] } },
  team: "ao-grind", pending: null, teams: {
  "ao-grind": { repo: "shiftlead", host: "kmaster", running: true, flow: "td", logins: ["claude-heather", "claude-paul", "claude-api"], caps: { build: 2 }, total: 0,
    work: [["TD-2090", "design", "14m"], ["TD-2077", "fact-check", "3m"], ["TD-2101", "build", "41m"], ["TD-2104", "build", "6m"], ["TD-2098", "review", "9m"], ["TD-2084", "you", "review", "2h"], ["TD-2071", "you", "design", "1d"]],
    set: { start: "reset", stops: "at", until: "Fri 06:00", prio: "10", hold: true, holdn: "10", holdd: "2d" } },
  "samscrape-grind": { repo: "samscrape", host: "kmaster", running: false, flow: "build-review", logins: ["claude-paul"], caps: {}, total: 0, work: [], set: { start: "hand", stops: "never", until: "Fri 06:00", prio: "0", hold: false, holdn: "10", holdd: "2d" } } } };
let D;
try { D = JSON.parse(localStorage.getItem("team-proto-v6")) || structuredClone(DEF); } catch (e) { D = structuredClone(DEF); }
const save = (msg) => { try { localStorage.setItem("team-proto-v6", JSON.stringify(D)); } catch (e) {} if (msg) toast(msg); draw(); };
const toast = (t) => { const e = document.getElementById("toast"); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => e.hidden = true, 2400); };
const T = () => D.teams[D.team];
const cap = (t, key) => t.caps[key] ?? 1;
const curList = () => D.page === "builtins" ? D.sets[D.set].logins : T().logins;
const setOf = (repo) => D.repoSet[repo] || "default";
function setCannot(name) { const s = D.sets[name]; return SEATS.filter(x => !pickLogin(s, s.models[x[0]]).offer.length).map(x => `${x[1].toLowerCase()}: no login in its list offers ${s.models[x[0]]}`); }
function pickLogin(t, model) { const offer = t.logins.filter(n => LOGINS[n].models.includes(model)); const hit = offer.find(n => LOGINS[n].state === "ok"); return { hit, offer, skipped: offer.slice(0, hit ? offer.indexOf(hit) : offer.length) }; }
function flowModels(f) { const m = new Set(); f.stages.forEach(s => m.add(s.model)); f.audits.forEach(a => m.add(a[1])); return [...m]; }
function cannot(t, name) { const miss = flowModels(FLOWS[name]).filter(m => !pickLogin(t, m).offer.length); return miss.length ? `no login in this team's list offers ${miss.join(", ")}` : ""; }

function ladder(list, usedNote) {
  return `<ol class="ladder">` + list.map((n, i) => { const l = LOGINS[n];
    return `<li class="${l.state === "ok" ? "" : "skip"}"><span class="n">${i + 1}</span><span class="who"><b>${n}</b>${l.metered ? '<span class="tagm">spends money</span>' : ""}<small>${l.tool} · ${l.acct}</small><small class="mono">${l.models.join(" ")}</small></span>
      <span class="use"><span class="${{ ok: "s-ok", wait: "s-wait", bad: "s-bad" }[l.state]}">${l.state === "ok" ? "Usable" : "Passed over"}</span><div class="gauge"><i style="width:${l.used}%"></i><u style="width:${l.keep}%"></u></div><small>${l.note}${usedNote(l)}</small></span>
      <span class="mv"><button data-up="${i}" ${i ? "" : "disabled"} aria-label="move ${n} up">▲</button><button data-down="${i}" ${i < list.length - 1 ? "" : "disabled"} aria-label="move ${n} down">▼</button><button data-rm="${i}" aria-label="remove ${n}">×</button></span></li>`; }).join("") + `</ol>`
    + (() => { const rest = Object.keys(LOGINS).filter(n => !list.includes(n)); return `<div class="addl">${rest.length ? `<select id="al" aria-label="add a login"><option value="">Add a login…</option>${rest.map(n => `<option value="${n}">${n} · ${LOGINS[n].tool} · ${LOGINS[n].models.join(", ")}</option>`).join("")}</select>` : "Every login on this host is in the list."}<button class="lnk" data-act="tools">Sign in a new one on Tools</button></div>`; })();
}
function drawSets() {
  const s = D.sets[D.set], bad = setCannot(D.set), repos = Object.keys(D.repoSet), users = repos.filter(r => setOf(r) === D.set);
  let h = `<div class="teams">` + Object.keys(D.sets).map(n => `<a class="${n === D.set ? "on" : ""}" data-setname="${n}">${n}${setCannot(n).length ? " <i>●</i>" : ""}</a>`).join("") + `<button class="quiet" data-act="newset">+ New set</button></div>`;
  h += `<div class="head"><h1>${s.label || D.set}</h1><button class="lnk" data-act="setlabel" aria-label="change the label">✎</button>${s.label ? `<span class="where mono">${D.set}</span>` : ""}<span class="where">${users.length ? "used by <b>" + users.join("</b>, <b>") + "</b>" : "used by no repo"}</span></div>`;
  if (bad.length) h += `<p class="bad">${D.set} cannot run the ${bad.join("; the ")}. That seat's work waits; no team is stopped by it.</p>`;
  h += `<h2>The seats</h2><p class="lead">Five seats stand outside every flow. A set gives each one a model, and every team of a repo that uses the set is served by it.</p><div class="tt">` + SEATS.map(x => { const m = s.models[x[0]], pk = pickLogin(s, m);
    return `<div><span>${x[1]}</span><span class="inl"><select data-seat="${x[0]}" aria-label="${x[1]} model">${MODELS.map(o => `<option ${o === m ? "selected" : ""}>${o}</option>`).join("")}</select><span>${!pk.offer.length ? "no login offers it" : pk.hit ? `on <b>${pk.hit}</b> now` : "waits for a usable login"}</span></span><span>${x[2]} · acts for ${x[3]}</span></div>`; }).join("") + `</div>`;
  h += `<h2>Logins, in the order they are tried</h2><p class="lead">A built-in seat starts on the first login here that offers its model and is usable right now. This list is the set's own; no team's list is used.</p>` + ladder(s.logins, l => Object.values(s.models).some(m => l.models.includes(m)) ? "" : " · no seat here uses its models");
  h += `<h2>Repos</h2><p class="lead">Each repo uses one set. The seats that act for a repo run while any of its teams is started.</p><div class="tt">` + repos.map(r => `<div><span>${r}</span><select data-repo="${r}" aria-label="${r} set">${Object.keys(D.sets).map(n => `<option ${n === setOf(r) ? "selected" : ""}>${n}</option>`).join("")}</select><span>${Object.entries(D.teams).filter(([, x]) => x.repo === r).map(([n, x]) => `${n} ${x.running ? "running" : "stopped"}`).join(" · ")}</span></div>`).join("") + `</div>`;
  h += `<p style="margin-top:22px"><button class="quiet" data-act="delset" ${D.set === "default" || users.length ? "disabled" : ""}>Delete ${D.set}</button> <span style="color:var(--soft);font-size:14px">${D.set === "default" ? "The default set always exists." : users.length ? `Move ${users.join(" and ")} to another set first.` : "No repo uses it."}</span></p>`;
  document.getElementById("main").innerHTML = h;
}
function draw() {
  document.getElementById("nav-teams").className = D.page === "teams" ? "on" : ""; document.getElementById("nav-builtins").className = D.page === "builtins" ? "on" : "";
  document.getElementById("railnote").textContent = D.page === "builtins" ? "The tech lead, manager, board answers, unheld pull requests and the sweeper are set here once, not in a flow or a team." : "A team is a repo, a flow and a list of logins. Its sessions are started for one entry in one stage and end with it, so a team has no members to name.";
  if (D.page === "builtins") return drawSets();
  const t = T(), f = FLOWS[t.flow], busy = t.work.filter(w => w[1] !== "you").length;
  let h = `<div class="teams">` + Object.entries(D.teams).map(([n, x]) => `<a class="${n === D.team ? "on" : ""}" data-team="${n}">${n}${cannot(x, x.flow) ? " <i>●</i>" : ""}</a>`).join("") + `<button class="quiet" data-act="new">+ New team</button></div>`;
  h += `<div class="head"><h1>${t.label || D.team}</h1><button class="lnk" data-act="label" aria-label="change the label">✎</button>${t.label ? `<span class="where mono">${D.team}</span>` : ""}<span class="where">works <b>${t.repo}</b> on ${t.host}</span><div class="act"><span class="live ${t.running ? "" : "off"}">${t.running ? `Running · ${busy} ${t.total ? `of ${t.total} ` : ""}sessions` : "Stopped"}</span><button data-act="run">${t.running ? "Wind down" : "Start"}</button></div></div>`;

  h += `<h2>The flow it runs</h2><div class="pick"><select id="fp" aria-label="flow">` + Object.keys(FLOWS).map(n => `<option value="${n}" ${n === (D.pending || t.flow) ? "selected" : ""}>${n}${cannot(t, n) ? " (cannot run here)" : ""}</option>`).join("") + `</select><span>${f.about}</span><button class="lnk" data-act="flows">Edit on Flows</button></div>`;
  if (D.pending) h += switchPanel(t);
  const why = cannot(t, t.flow);
  if (why) h += `<p class="bad">${D.team} cannot run ${t.flow}: ${why}. Add one below or pick another flow. Nothing new starts until then.</p>`;
  h += `<div class="map">` + f.lines.map(([label, keys]) => { const first = f.stages.find(s => s.key === keys[0]);
    return `<div class="ln" style="--c:var(${KC[first.does]})"><div class="from"><b>${label}</b> start here</div><div class="stops">` + keys.map(k => { const s = f.stages.find(x => x.key === k), p = pickLogin(t, s.model);
      const here = t.work.filter(w => w[1] === k), asked = t.work.filter(w => w[1] === "you" && w[2] === k);
      return `<div class="stop" style="--k:var(${KC[s.does]})"><div class="nm">${s.name}</div><div class="kind">${s.does}${s.only ? ", only for protected files" : ""}</div>
        <div class="on ${p.hit ? "" : "no"}"><b>${s.model}</b> ${!p.offer.length ? "no login offers it" : p.hit ? `on <b>${p.hit}</b>` : "waits for a usable login"}</div>
        <div class="step">at most <button data-less="${k}" aria-label="${s.name}: one fewer at once">−</button><b>${cap(t, k)}</b><button data-more="${k}" aria-label="${s.name}: one more at once">+</button> at once</div>
        <div class="riders">${here.map(w => `<span class="rider">${w[0]}<small>${w[2]}</small></span>`).join("")}${asked.map(w => `<span class="rider you" title="waits on you">${w[0]}<small>asked you ${w[3]} ago</small></span>`).join("")}</div></div>`; }).join("") +
      `<div class="stop end" style="--k:var(--ink)"><div class="nm">merged</div></div></div></div>`; }).join("");
  h += `<div class="aside"><h3>Beside the path</h3>` + f.audits.map(a => `<div><b>${a[0]}</b> ${a[2]}<span class="mono">${a[1]}</span></div>`).join("") + `<div><b>Built-in seats</b> <button class="lnk" data-act="toset">set ${setOf(t.repo)}</button>${setCannot(setOf(t.repo)).length ? ` <span style="color:var(--bad)">cannot run the ${setCannot(setOf(t.repo))[0]}</span>` : ""}</div></div></div>`;
  h += `<div class="total">Whole team: <select id="tl" aria-label="team limit"><option value="0" ${t.total ? "" : "selected"}>no team limit</option><option value="1" ${t.total ? "selected" : ""}>at most</option></select>${t.total ? `<span class="step"><button data-less="@" aria-label="one fewer session at once">−</button><b>${t.total}</b><button data-more="@" aria-label="one more session at once">+</button></span> stage and audit sessions at once. Built-in seats are not counted.` : `the stage counts above are the only bound: up to ${f.stages.reduce((n, x) => n + cap(t, x.key), 0)} at once.`}</div>`;

  h += `<h2>Logins, in the order they are tried</h2><p class="lead">A session starts on the first login here that offers its stage's model and is usable right now. When a login reaches its reserve or a limit, its sessions move down the list. Logins are signed in on Tools.</p>` + ladder(t.logins, l => flowModels(f).some(m => l.models.includes(m)) ? "" : ` · ${t.flow} names none of its models, so nothing runs on it yet`);

  const s = t.set, sel = (k, opts) => `<select data-set="${k}">${opts.map(o => `<option value="${o[0]}" ${s[k] === o[0] ? "selected" : ""}>${o[1]}</option>`).join("")}</select>`;
  h += `<h2>When it runs</h2><div class="tt">
    <div><span>Starts</span>${sel("start", [["hand", "when I press Start"], ["reset", "at each week's reset"]])}<span>${s.start === "reset" ? "next Thu 07:00, read from the first login" : "only you start it"}</span></div>
    <div><span>Stops</span><span class="inl">${sel("stops", [["never", "never"], ["at", "at"]])}${s.stops === "at" ? `<input type="text" data-set="until" value="${s.until}" style="width:120px" aria-label="stop time">` : ""}</span><span>${s.stops === "at" ? "nothing starts after this; sessions finish their stage" : "it runs until you wind it down"}</span></div>
    <div><span>Leaves for other teams</span><span class="inl"><input type="text" data-set="prio" value="${s.prio}" aria-label="points left"> points of each login</span><span>${+s.prio ? `stops ${s.prio} points before each login's reserve` : "runs up to each login's reserve"}</span></div>
    <div><span>Holds new work</span><span class="inl"><input type="checkbox" data-set="hold" ${s.hold ? "checked" : ""} aria-label="hold new work"> past <input type="text" data-set="holdn" value="${s.holdn}" aria-label="open pull requests"> open pull requests, or one open <input type="text" data-set="holdd" value="${s.holdd}" aria-label="age"></span><span>${s.hold ? "now 4 open, oldest 19h · work already in a stage carries on" : "off"}</span></div></div>`;
  h += `<p style="margin-top:22px"><button class="quiet" data-act="del" ${t.running || t.work.length ? "disabled" : ""}>Delete ${D.team}</button> <span style="color:var(--soft);font-size:14px">${t.running ? "Wind it down first." : t.work.length ? `${t.work.length} entries are still in its stages or waiting on you.` : "Its entries stay in the ledger."}</span></p>`;
  document.getElementById("main").innerHTML = h;
}
const f3 = (t) => FLOWS[t.flow].stages.reduce((n, x) => n + cap(t, x.key), 0);
function switchPanel(t) {
  const to = FLOWS[D.pending], keys = to.stages.map(s => s.key), why = cannot(t, D.pending), nm = k => FLOWS[t.flow].stages.find(s => s.key === k).name;
  const rows = t.work.map(w => w[1] === "you" ? `<tr><td>${w[0]}</td><td>waits on you</td><td class="stay">still waits; if your answer names a stage ${D.pending} lacks, you are asked once more</td></tr>`
    : keys.includes(w[1]) ? `<tr><td>${w[0]}</td><td>in ${nm(w[1])}</td><td class="stay">stays, and its session carries on</td></tr>`
    : `<tr><td>${w[0]}</td><td>in ${nm(w[1])}</td><td class="go">${D.pending} has no ${nm(w[1])}: the session ends and the entry comes to you</td></tr>`).join("");
  const n = t.work.filter(w => w[1] !== "you" && !keys.includes(w[1])).length;
  return `<div class="sw"><h3>Switch ${D.team} from ${t.flow} to ${D.pending}?</h3>${why ? `<p class="bad">It cannot run ${D.pending}: ${why}. Add one to the list below first.</p>` : rows ? `<table>${rows}</table><p>${n ? `${n} ${n === 1 ? "entry comes" : "entries come"} to your Queue; their pull requests stay open.` : "Nothing comes to you."} New entries start in ${D.pending} from now on.</p>` : `<p>No entry is in a stage, so nothing moves.</p>`}
    <div class="btns"><button class="pri" data-act="switch" ${why ? "disabled" : ""}>Switch now</button><button class="quiet" data-act="noswitch">Keep ${t.flow}</button></div></div>`;
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-nav],[data-setname],[data-team],[data-act],[data-up],[data-down],[data-rm],[data-less],[data-more]"); if (!b || b.disabled) return;
  const t = T(), d = b.dataset;
  if (d.nav) { if (d.nav === "teams" || d.nav === "builtins") { D.page = d.nav; D.pending = null; return save(); } return toast(`Opens ${d.nav}.`); }
  if (d.setname) { D.set = d.setname; return save(); }
  if (d.act === "toset") { D.page = "builtins"; D.set = setOf(t.repo); return save(); }
  if (d.act === "newset") { let n = "second", i = 2; while (D.sets[n]) n = "set-" + (++i); D.sets[n] = { label: "", models: { ...D.sets.default.models }, logins: [] }; D.set = n; return save(`${n} made with default's models and no logins. Add one below.`); }
  if (d.act === "delset") { delete D.sets[D.set]; D.set = "default"; return save("Set deleted."); }
  if (d.act === "setlabel") { const s = D.sets[D.set]; s.label = s.label ? "" : "Everyday seats"; return save(s.label ? "Label saved. The name stays the same underneath." : "Label cleared."); }
  if (d.team) { D.team = d.team; D.pending = null; return save(); }
  if (d.less || d.more) { const k = d.less || d.more, by = d.more ? 1 : -1; if (k === "@") t.total = Math.max(1, t.total + by); else t.caps[k] = Math.max(1, cap(t, k) + by); return save("Saved. It applies from the next session started."); }
  if (d.up !== undefined || d.down !== undefined) { const i = +(d.up ?? d.down), j = d.up !== undefined ? i - 1 : i + 1; const li = curList(); [li[i], li[j]] = [li[j], li[i]]; return save("Order saved. It applies at each session's start."); }
  if (d.rm !== undefined) { const n = curList().splice(+d.rm, 1)[0]; return save(`${n} removed. Sessions on it finish what they are doing.`); }
  if (d.act === "switch") { const keys = FLOWS[D.pending].stages.map(s => s.key); t.work = t.work.filter(w => w[1] === "you" || keys.includes(w[1])); t.flow = D.pending; D.pending = null; return save("Switched. Entries with no stage are on your Queue."); }
  if (d.act === "noswitch") { D.pending = null; return save(); }
  if (d.act === "run") { t.running = !t.running; return save(t.running ? "Started." : "Winding down: sessions finish their stage."); }
  if (d.act === "label") { t.label = t.label ? "" : "ShiftLead builders"; return save(t.label ? "Label saved. The name ao-grind stays the same underneath." : "Label cleared."); }
  toast({ flows: "Opens this flow on Flows.", tools: "Opens Tools.", new: "New team: a name, a repo and a flow.", del: "Asks once, then removes the team." }[d.act]);
});
document.addEventListener("change", (e) => {
  const el = e.target, t = T();
  if (el.id === "fp") { D.pending = el.value === t.flow ? null : el.value; return save(); }
  if (el.dataset.seat) { D.sets[D.set].models[el.dataset.seat] = el.value; return save("Saved. It applies at the seat's next start."); }
  if (el.dataset.repo) { D.repoSet[el.dataset.repo] = el.value; return save(`${el.dataset.repo} now uses ${el.value}.`); }
  if (el.id === "al" && el.value) { curList().push(el.value); return save(`${el.value} added at the end of the list.`); }
  if (el.id === "tl") { t.total = +el.value ? f3(t) : 0; return save("Saved."); }
  if (el.dataset.set) { t.set[el.dataset.set] = el.type === "checkbox" ? el.checked : el.value; return save("Saved."); }
});
draw();
</script>
